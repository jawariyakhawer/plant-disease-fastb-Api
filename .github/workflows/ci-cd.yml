
name: Plant Disease API CI/CD

on:
  push:
    branches:
      - main

jobs:

  # -------------------------
  # 1. TEST APPLICATION
  # -------------------------
  test:
    name: Test Application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Test Application
        run: |
          python -m pytest


  # -------------------------
  # 2. BUILD & PUSH DOCKER
  # -------------------------
  docker:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest

    needs: test

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker Image
        run: |
          docker build \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/plant-disease-api:latest \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/plant-disease-api:${{ github.sha }} .

      - name: Push Docker Image
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/plant-disease-api:latest
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/plant-disease-api:${{ github.sha }}
```
